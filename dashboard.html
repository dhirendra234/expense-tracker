<!DOCTYPE html>
<html>
<head>

  <title>Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>

<body>

<h1 id="welcome"></h1>

<hr>

<h2>Add Expense</h2>

<input type="text"
id="description"
placeholder="Description">

<br><br>

<input type="number"
id="amount"
placeholder="Amount">

<br><br>

<input type="text"
id="category"
placeholder="Category">

<br><br>

<input type="date"
id="expense_date">

<br><br>

<button onclick="saveExpense()">
Save Expense
</button>

<br><br>

<button onclick="logout()">
Logout
</button>

<script>

const supabaseUrl = "https://xiixbuviocucvyoeclfm.supabase.co";

const supabaseKey = "sb_publishable_WANF1cnsNAF9XcO9VbZe7Q_XhCgWqit";

const client = supabase.createClient(
supabaseUrl,
supabaseKey
);

let currentUser;

async function getUser(){

    const {
      data: { user }
    } = await client.auth.getUser();

    if(!user){

        window.location.href =
        "login.html";

        return;
    }

    currentUser = user;

    const { data, error } =
    await client
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

    if(data.user_type=="student"){

        document.getElementById("welcome")
        .innerHTML =
        "Welcome Student";

    }

    else{

        document.getElementById("welcome")
        .innerHTML =
        "Welcome Salaried User";
    }
}

async function saveExpense(){

    let description =
    document.getElementById("description").value;

    let amount =
    document.getElementById("amount").value;

    let category =
    document.getElementById("category").value;

    let expense_date =
    document.getElementById("expense_date").value;

    const { error } =
    await client
    .from("expenses")
    .insert([
      {
        user_id: currentUser.id,
        description: description,
        amount: amount,
        category: category,
        expense_date: expense_date
      }
    ]);

    if(error){

        alert("Error Saving Expense");

    }

    else{

        alert("Expense Saved");
    }
}

async function logout(){

    await client.auth.signOut();

    window.location.href =
    "login.html";
}

getUser();

</script>

</body>
</html>
