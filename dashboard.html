<!DOCTYPE html>
<html>
<head>

  <title>Expense Tracker Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f4f7fc;
      padding:30px;
    }

    .container{
      max-width:1100px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0px 0px 10px rgba(0,0,0,0.1);
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    .form-group{
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    button{
      padding:10px 20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
    }

    .save-btn{
      background:#007bff;
      color:white;
    }

    .logout-btn{
      background:red;
      color:white;
      float:right;
    }

    .edit-btn{
      background:orange;
      color:white;
    }

    .delete-btn{
      background:red;
      color:white;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:25px;
    }

    table th{
      background:#007bff;
      color:white;
      padding:12px;
    }

    table td{
      padding:12px;
      border:1px solid #ddd;
      text-align:center;
    }

    tr:nth-child(even){
      background:#f2f2f2;
    }

    .total-box{
      margin-top:20px;
      padding:15px;
      background:#e8f0ff;
      border-radius:10px;
      font-size:20px;
      font-weight:bold;
    }

  </style>

</head>

<body>

<div class="container">

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

    <h1 id="welcome"></h1>

    <div class="form-group">
      <input type="text"
      id="description"
      placeholder="Enter Description">
    </div>

    <div class="form-group">
      <input type="number"
      id="amount"
      placeholder="Enter Amount">
    </div>

    <div class="form-group">
      <input type="text"
      id="category"
      placeholder="Enter Category">
    </div>

    <div class="form-group">
      <input type="date"
      id="expense_date">
    </div>

    <button class="save-btn"
    onclick="saveExpense()">
      Save Expense
    </button>

    <div class="total-box">
      Total Expense: ₹
      <span id="totalExpense">0</span>
    </div>

    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th>Edit</th>
          <th>Delete</th>

        </tr>

      </thead>

      <tbody id="expenseTableBody">

      </tbody>

    </table>

</div>

<script>

const supabaseUrl =
"https://xiixbuviocucvyoeclfm.supabase.co";

const supabaseKey =
"sb_publishable_WANF1cnsNAF9XcO9VbZe7Q_XhCgWqit";

const client =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

let currentUser;
let editId = null;

async function getUser(){

    const {
      data: { user }
    } = await client.auth.getUser();

    if(!user){

        window.location.href =
        "login.html";

        return;
    }

    currentUser = user;

    document.getElementById("welcome")
    .innerHTML =
    `Welcome ${user.email}`;

    await loadExpenses();
}

async function saveExpense(){

    let description =
    document.getElementById("description").value.trim();

    let amount =
    document.getElementById("amount").value;

    let category =
    document.getElementById("category").value.trim();

    let expense_date =
    document.getElementById("expense_date").value;

    if(
      !description ||
      !amount ||
      !category ||
      !expense_date
    ){
      alert("Please fill all fields");
      return;
    }

    if(editId == null){

        const { error } =
        await client
        .from("expenses")
        .insert([
          {
            user_id: currentUser.id,
            description,
            amount,
            category,
            expense_date
          }
        ]);

        if(error){

            alert(error.message);

        }

        else{

            alert("Expense Saved");
        }
    }

    else{

        const { error } =
        await client
        .from("expenses")
        .update({
            description,
            amount,
            category,
            expense_date
        })
        .eq("id", editId)
        .eq("user_id", currentUser.id);

        if(error){

            alert(error.message);

        }

        else{

            alert("Expense Updated");

            editId = null;
        }
    }

    clearForm();

    loadExpenses();
}

async function loadExpenses(){

    const { data, error } =
    await client
    .from("expenses")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("id", { ascending:false });

    if(error){

        console.log(error);

    }

    else{

        let table =
        document.getElementById(
        "expenseTableBody"
        );

        table.innerHTML = "";

        let total = 0;

        data.forEach(expense => {

            total += Number(expense.amount);

            table.innerHTML += `

            <tr>

                <td>${expense.id}</td>

                <td>${expense.description}</td>

                <td>₹${expense.amount}</td>

                <td>${expense.category}</td>

                <td>${expense.expense_date}</td>

                <td>

                  <button
                  class="edit-btn"
                  onclick='editExpense(${JSON.stringify(expense)})'>

                  Edit

                  </button>

                </td>

                <td>

                  <button
                  class="delete-btn"
                  onclick="deleteExpense(${expense.id})">

                  Delete

                  </button>

                </td>

            </tr>

            `;
        });

        document.getElementById(
        "totalExpense"
        ).innerHTML = total;
    }
}

function editExpense(expense){

    editId = expense.id;

    document.getElementById(
    "description"
    ).value = expense.description;

    document.getElementById(
    "amount"
    ).value = expense.amount;

    document.getElementById(
    "category"
    ).value = expense.category;

    document.getElementById(
    "expense_date"
    ).value = expense.expense_date;
}

async function deleteExpense(id){

    let confirmDelete =
    confirm("Are you sure?");

    if(!confirmDelete){
      return;
    }

    const { error } =
    await client
    .from("expenses")
    .delete()
    .eq("id", id)
    .eq("user_id", currentUser.id);

    if(error){

        alert(error.message);

    }

    else{

        alert("Expense Deleted");

        loadExpenses();
    }
}

function clearForm(){

    document.getElementById(
    "description"
    ).value = "";

    document.getElementById(
    "amount"
    ).value = "";

    document.getElementById(
    "category"
    ).value = "";

    document.getElementById(
    "expense_date"
    ).value = "";
}

async function logout(){

    await client.auth.signOut();

    window.location.href =
    "login.html";
}

getUser();

</script>

</body>
</html>
