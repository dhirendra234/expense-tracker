<!DOCTYPE html>
<html>
<head>

  <title>Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .login-box{
      width:350px;
      background:white;
      padding:40px;
      border-radius:15px;
      box-shadow:0px 10px 25px rgba(0,0,0,0.2);
      text-align:center;
    }

    .login-box h2{
      margin-bottom:25px;
      color:#333;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      font-size:16px;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#4facfe;
      box-shadow:0px 0px 8px rgba(79,172,254,0.5);
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg,#4facfe,#00c6fb);
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      transform:translateY(-2px);
      box-shadow:0px 8px 15px rgba(0,0,0,0.2);
      background:linear-gradient(135deg,#00c6fb,#4facfe);
    }

    .footer-text{
      margin-top:15px;
      color:#666;
      font-size:14px;
    }

  </style>

</head>

<body>

<div class="login-box">

  <h2>Expense Tracker Login</h2>

  <div class="input-box">
    <input type="email"
    id="email"
    placeholder="Enter Email">
  </div>

  <div class="input-box">
    <input type="password"
    id="password"
    placeholder="Enter Password">
  </div>

  <button class="login-btn"
  onclick="login()">
    Login
  </button>

  <div class="footer-text">
    Welcome Back 👋
  </div>

</div>

<script>

const supabaseUrl =
"https://xiixbuviocucvyoeclfm.supabase.co";

const supabaseKey =
"sb_publishable_WANF1cnsNAF9XcO9VbZe7Q_XhCgWqit";

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

async function login(){

    let email =
    document.getElementById("email").value.trim();

    let password =
    document.getElementById("password").value.trim();

    if(!email || !password){

        alert("Please enter email and password");

        return;
    }

    const { data, error } =
    await client.auth.signInWithPassword({

        email: email,
        password: password

    });

    if(error){

        alert(error.message);

    }

    else{

        alert("Login Successful");

        window.location.href =
        "dashboard.html";
    }
}

</script>

</body>
</html>
