<!DOCTYPE html>
<html>
<head>

  <title>Expense Tracker</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:linear-gradient(
      135deg,
      #667eea,
      #764ba2
      );

    }

    .container{

      background:white;

      padding:50px;

      border-radius:20px;

      text-align:center;

      width:400px;

      box-shadow:0px 0px 20px rgba(0,0,0,0.2);

    }

    h1{

      margin-bottom:30px;

      color:#333;

      font-size:40px;

    }

    button{

      width:100%;

      padding:15px;

      margin-top:15px;

      border:none;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;

      color:white;

      transition:0.3s;

    }

    .signup{

      background:#28a745;

    }

    .login{

      background:#007bff;

    }

    button:hover{

      transform:scale(1.05);

    }

  </style>

</head>

<body>

<div class="container">

  <h1>Expense Tracker</h1>

  <button class="signup"
  onclick="window.location.href='signup.html'">

    Signup

  </button>

  <button class="login"
  onclick="window.location.href='login.html'">

    Login

  </button>

</div>

</body>
</html>
